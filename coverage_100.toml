# 100% 行カバレッジの登録簿 (rust-ichibanboshi の scripts/check_coverage_100.sh と同じ書式)。
#
#   cargo llvm-cov --locked -p fuel-logic --text > cov.txt
#   bash scripts/check_coverage_100.sh --config coverage_100.toml --use-cache cov.txt
#
# logic は native で動く純粋ロジック。worker crate (socket・応答) は wasm32 専用なので計測しない。
# logic/src/lib.rs は mod 宣言だけなので登録しない。cargo-llvm-cov は計測対象のソースが 1 ファイルだと見出し行を出さず
# gate が読めなくなるので、logic は 2 ファイル以上に分けておく。

# 経路判定 (GET /api/fuel/health の 1 本。それ以外は 404 / 405)
[[files]]
path = "logic/src/route.rs"

# 失敗の段・応答の写像・失敗ログの 1 行
[[files]]
path = "logic/src/reply.rs"

# 参照・編集の口に共通の部品 (失敗の応答・セルの JSON 化・path / query / 本文の読み取り・SQL の展開)
[[files]]
path = "logic/src/api.rs"

# 認可 (X-Tenant-ID と FUEL_TENANT_ID の突き合わせ)
[[files]]
path = "logic/src/auth.rs"

# fuel_intank の参照・編集 (SQL 定数・JSON の組み立て・本文の検査)
[[files]]
path = "logic/src/intank.rs"

# fuel_cards の参照・編集と select 用の一覧
[[files]]
path = "logic/src/cards.rs"

# UTRAN.CSV の SJIS の decode と行の解釈 (start / fuel)
[[files]]
path = "logic/src/csv.rs"

# 伝票番号の補完 (setSlipNum / setSlipNumParent)
[[files]]
path = "logic/src/slip.rs"

# dtako_row_id の照合の判定と SQL 定数
[[files]]
path = "logic/src/dtako_match.rs"

# 取り込みの SQL (既存キーの SELECT・複数行 INSERT) とスキップ
[[files]]
path = "logic/src/ingest.rs"

# R2 inbox の口の判定・key・応答の形
[[files]]
path = "logic/src/inbox.rs"

# USB アプリからの受け口 (共有 secret の定数時間比較・issueTicket の戻りの解釈・応答・customMetadata)
[[files]]
path = "logic/src/machine.rs"
