name: Deploy

# fuel Worker (rust-fuel-worker) の本番 deploy (rust-ichibanboshi の worker-kintai.yml の deploy job の形。Refs yhonda-ohishi/nginx#814)。
#   - タグ v* の push → 本番へ wrangler deploy (wrangler.toml のトップレベル。env は持たない、staging は作らない)
# merge では本番に出ない (タグで deploy)。ci.yml はタグの push では走らないので、同じ検査をここで先に回す。
# token は org の secret CLOUDFLARE_API_TOKEN (repo 単位の secret は作らない)。account_id は書かない。
# wrangler の出力はファイルに取り、mask してから伏せて出す。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # README と揃える
  WRANGLER_VERSION: 4.144.0

jobs:
  check:
    name: check (ci.yml と同じ検査)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: fuel-worker
          save-if: false

      - name: Test (fuel-logic)
        run: cargo test --locked -p fuel-logic

      - uses: taiki-e/install-action@cargo-llvm-cov

      # 行カバレッジ 100% gate (登録簿 coverage_100.toml)。logic は経路判定・失敗の段・応答の写像なので全行を通す。
      # worker crate (socket・応答) は wasm32 専用なので計測しない
      - name: Coverage 100% gate (fuel-logic)
        run: |
          cov="$RUNNER_TEMP/fuel-cov.txt"
          cargo llvm-cov --locked -p fuel-logic --text > "$cov"
          bash scripts/check_coverage_100.sh --config coverage_100.toml --use-cache "$cov"

      - name: Build (wasm32-unknown-unknown)
        run: cargo build --locked -p fuel-worker --target wasm32-unknown-unknown

      - name: Clippy (worker、wasm32-unknown-unknown)
        run: cargo clippy --locked -p fuel-worker --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Clippy (logic、native)
        run: cargo clippy --locked -p fuel-logic --all-targets -- -D warnings

      - name: fmt
        run: cargo fmt --all --check

      # wrangler.toml の [build] command と同じ版
      - run: cargo install -q worker-build@0.8.7 --locked

      - name: worker-build --release
        working-directory: worker
        run: worker-build --release

      - name: Exposure check
        run: bash scripts/check-exposure.sh worker/wrangler.toml

      - name: Exposure check (negative control)
        run: bash scripts/check-exposure-test.sh worker/wrangler.toml

      # secret も token も要らない (build と設定の検証だけ)
      - name: wrangler deploy --dry-run
        working-directory: worker
        run: npx -y "wrangler@${WRANGLER_VERSION}" deploy --dry-run

  deploy:
    name: deploy production
    needs: [check]
    runs-on: ubuntu-latest
    concurrency:
      group: fuel-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: fuel-worker
          save-if: false

      # wrangler.toml の [build] command と同じ版
      - run: cargo install -q worker-build@0.8.7 --locked

      # wrangler の出力は $RUNNER_TEMP/deploy.log に取り、伏せてから出す (ログファイルそのものは出さない)。
      #   - 32 桁の hex (account ID): ::add-mask:: + <account> に置換
      - name: wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          log="$RUNNER_TEMP/deploy.log"
          status=0
          npx -y "wrangler@${WRANGLER_VERSION}" deploy \
            --tag "$GITHUB_REF_NAME" --message "$GITHUB_SHA" >"$log" 2>&1 || status=$?
          # 何かを出す前に mask を登録する
          grep -oE '[0-9A-Fa-f]{32}' "$log" | sort -u | while read -r hex; do
            echo "::add-mask::${hex}"
          done
          sed -E -e 's#[A-Za-z0-9.-]+\.workers\.dev#<workers-dev>#g' -e 's#[0-9A-Fa-f]{32}#<account>#g' "$log"
          [ "$status" = 0 ] || exit "$status"
          # workers_dev = false なので workers.dev の URL は出ないはず (出たら公開されている)
          if grep -qE '[A-Za-z0-9.-]+\.workers\.dev' "$log"; then
            echo "::error::本番に workers.dev の URL が付いた (workers_dev = false のはず。直ちに止めること)"
            exit 1
          fi
