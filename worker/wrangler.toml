# rust-fuel-worker: インタンク給油 (fuel_intank / fuel_cards) の Worker。CakePHP の /fuel-intank・/fuel-cards の移行先
# (Refs yhonda-ohishi/nginx#814)。
# Service Binding 専用。口は GET /api/fuel/health (社内 MariaDB に繋いで SELECT 1 を流す到達の確認用・認可なし) と、
# X-Tenant-ID が FUEL_TENANT_ID と一致するときだけ通す参照・編集の口 (/api/fuel/starts・intank・cards ほか)、
# USB 常駐アプリからの UTRAN.CSV の口 POST /machine/fuel-utran/uploads (auth-worker の machine-relay が中継する。
# 共有 secret INTERNAL_SHARED_SECRET で中継かを確かめ、tenant は auth-worker の RPC issueTicket (AUTH_MCRED) で決める)。
#
# ★ 外から届く口を持たない:
#   - fetch は Service Binding からだけ届く (route・workers.dev・preview なし)。
#   - workers_dev = false / preview_urls = false、route / routes を書かない、env を作らない
#   - MariaDB への口 (vpc_services)・資格情報 (secrets_store_secrets)・R2 (r2_buckets)・auth-worker の RPC と fetch (services) は
#     トップレベルにだけ置く。
#     ローカルで迂回する LOCAL_* の var は持たない
#   scripts/check-exposure.sh が CI で毎回これを検査する (陰性対照は scripts/check-exposure-test.sh)。
# account_id は書かない (CLOUDFLARE_API_TOKEN から決まる)。
# 本番へはタグ v* の push で deploy する (.github/workflows/deploy.yml)。
name = "rust-fuel-worker"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

# Workers Logs (ログは段・失敗の種類・所要ミリ秒だけ)
[observability]
enabled = true

# MariaDB への口 (tcp 3306)。勤怠 Worker (ichibanboshi-kintai) と同じ VPC Service を共用する。
# 宛先の Tunnel・host:port は VPC Service 側に閉じる (コードの connect() の宛先は名目)。
# service_id は VPC Service の id (資格情報でも宛先でもない)。
[[vpc_services]]
binding = "KINTAI_MARIADB_VPC"
service_id = "01a12419-659c-7b21-ac68-945c6f23ccc8"
remote = true

# MariaDB の資格情報は 2 本に分ける。store_id は Secrets Store の id、secret_name は secret 名 (どちらも値そのものではない)。
# 中身は JSON (キー user/password/database。値は repo に書かない)。未投入なら該当の口は 503 (stage=secret)
# 読み取り専用。勤怠 Worker と共用 (GET /api/fuel/health・starts・intank・unregistered-cards・cars・cards)
[[secrets_store_secrets]]
binding = "KINTAI_MARIADB"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "KINTAI_MARIADB"

# 書き込み用。fuel_intank・fuel_cards の INSERT・UPDATE・DELETE と、照合のための dtako_rows・fuel_cards の SELECT
# (cards の POST/PATCH/DELETE・intank の PATCH/DELETE・UTRAN.CSV の取り込み = uploads・machine・定時)
[[secrets_store_secrets]]
binding = "FUEL_MARIADB_WRITE"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "FUEL_MARIADB_WRITE"

# 給油 CSV の受け取り置き場 (CSV の取り込み = 後続 PR で使う)。バケットはこの PR では作らない。
[[r2_buckets]]
binding = "FUEL_INBOX"
bucket_name = "fuel-inbox"

# USB の口が中継か (auth-worker の machine-relay か) を確かめる共有 secret (値は repo に無い。rust-leave-worker と同じ)。
# 未投入なら POST /machine/fuel-utran/uploads は 503
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# auth-worker の機械用資格情報のチケットの口 (RPC。issueTicket で Basic を照合し tenant を決める。worker/src/machine.rs)。
# entrypoint を付けるので、呼べるのは MachineCredentialEntrypoint のメソッドだけ
[[services]]
binding = "AUTH_MCRED"
service = "auth-worker"
entrypoint = "MachineCredentialEntrypoint"

# auth-worker の既定の fetch (entrypoint なし)。使うのは定時の inform (13:00 JST) が叩く
# /alc-internal-proxy/api/internal/lineworks/send の 1 path だけ (worker/src/inform.rs。nuxt-dtako-admin の
# dtako-scraper-relay の AUTH_WORKER と同じ経路)。auth-worker の fetch 面は元から公開の route で、内部用 proxy は
# X-Alc-Proxy-Secret (= INTERNAL_SHARED_SECRET) を見るので、この binding で増える到達は無い
[[services]]
binding = "AUTH_WORKER"
service = "auth-worker"

# 認可で突き合わせる tenant (X-Tenant-ID と一致すること)。ここは空のままにする (UUID を git に焼かない)。
# 本番は deploy.yml が repo variable FUEL_TENANT_ID を --var FUEL_TENANT_ID:… で渡す。空・UUID でない・nil なら
# health 以外の /api/fuel/* は 503。scripts/check-exposure.sh が空であることを検査する。
[vars]
FUEL_TENANT_ID = ""
# inform の LINE WORKS の宛先。{"channel_id":"<uuid>"} か {"recipient_id":"<uuid>"} の JSON 1 件 (rust-alc-api の
# lineworks_channels / notify_recipients の行 id。LINE WORKS の channelId ではない)。ここは空のままにする。
# 空・不正なら inform は送らずログに 1 行出す (fail-closed)。scripts/check-exposure.sh が空であることを検査する。
FUEL_INFORM_TARGET = ""

# 定時実行: */10 は R2 の utran/ の下を全部取り込み直す (取り込みは何度流しても同じ結果になる。worker/src/inbox.rs)。
# 0 4 * * * (13:00 JST) は給油データが前日の 12:00 まで届いているかを見て、届いていなければ LINE WORKS に送る
# (CakePHP の /fuel-intank/inform。worker/src/inform.rs。文字列は fuel_logic::inform::INFORM_CRON と同じ)
[triggers]
crons = ["*/10 * * * *", "0 4 * * *"]
