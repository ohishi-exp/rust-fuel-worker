# fuel Worker (Refs yhonda-ohishi/nginx#814)。Service Binding からだけ届く。
# 口は GET /api/fuel/health の 1 本。Workers VPC 経由で社内 MariaDB に平文の MySQL プロトコルで繋ぐ (1 リクエスト 1 接続)。
# socket と接続の上のやり取りは共有 crate vpc-mysql、プロトコルの読み書きは kintai-mysql (I/O 無し)、
# 経路判定と応答の写像は fuel-logic。どちらも ohishi-exp/rust-ichibanboshi の rev 固定 (勤怠 Worker と同じ部品)。
[package]
name = "fuel-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fuel-logic = { path = "../logic" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kintai-mysql = { git = "https://github.com/ohishi-exp/rust-ichibanboshi", rev = "6d9f7de061f9208bfdb37611df2afdc101c0b41d" }
vpc-mysql = { git = "https://github.com/ohishi-exp/rust-ichibanboshi", rev = "6d9f7de061f9208bfdb37611df2afdc101c0b41d" }
worker = "=0.8.7"
worker-sys = "=0.8.7"
