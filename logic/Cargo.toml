# fuel Worker の純粋ロジック (経路判定・失敗の段・応答の写像)。I/O を持たず native で cargo test できる。
# workers/kintai の worker/src/probe.rs の形を fuel 用に縮めて写している。
[package]
name = "fuel-logic"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
# 日時の値 (bind の Value::DateTime) と、SQL の名前付き引数の展開・結果セットの型 (worker と同じ rev)
chrono = { version = "0.4", default-features = false, features = ["std"] }
kintai-mysql = { git = "https://github.com/ohishi-exp/rust-ichibanboshi", rev = "6d9f7de061f9208bfdb37611df2afdc101c0b41d" }
# UTRAN.CSV (SJIS) の decode
encoding_rs = "0.8"
# R2 の key (utran/<sha256>.csv)
sha2 = "0.10"
